<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="498" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">企業導入 MCP：員工用 AI 查詢公司資料庫</text>

  <!-- 欄位標題 -->
  <text x="165" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#64748b">員工的電腦</text>
  <text x="530" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#64748b">公司的伺服器</text>
  <text x="830" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#64748b">資料庫</text>

  <!-- 員工 -->
  <g>
    <rect x="40" y="95" width="250" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="60" y="121" font-size="16" font-weight="700" fill="#9a3412">Claude Desktop</text>
    <text x="60" y="143" font-size="14" fill="#334155">業務部 林美玲</text>

    <rect x="40" y="190" width="250" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="60" y="216" font-size="16" font-weight="700" fill="#9a3412">Claude Desktop</text>
    <text x="60" y="238" font-size="14" fill="#334155">行銷部 李佳穎</text>

    <rect x="40" y="285" width="250" height="60" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="60" y="311" font-size="16" font-weight="700" fill="#9a3412">Claude Code / VS Code</text>
    <text x="60" y="333" font-size="14" fill="#334155">資訊部 陳志豪</text>

    <rect x="40" y="390" width="250" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="60" y="414" font-size="16" font-weight="700" fill="#b91c1c">陌生人</text>
    <text x="60" y="435" font-size="14" fill="#334155">知道網址，但沒有 token</text>
  </g>

  <!-- 員工 → 伺服器 -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="290" y1="125" x2="388" y2="125" marker-end="url(#arrow)"/>
    <line x1="290" y1="220" x2="388" y2="220" marker-end="url(#arrow)"/>
    <line x1="290" y1="315" x2="388" y2="315" marker-end="url(#arrow)"/>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="303" y="113" width="72" height="24" rx="12" fill="#fde68a" stroke="#d97706"/>
    <text x="339" y="130" fill="#92400e">token A</text>
    <rect x="303" y="208" width="72" height="24" rx="12" fill="#fde68a" stroke="#d97706"/>
    <text x="339" y="225" fill="#92400e">token B</text>
    <rect x="303" y="303" width="72" height="24" rx="12" fill="#fde68a" stroke="#d97706"/>
    <text x="339" y="320" fill="#92400e">token C</text>
  </g>

  <!-- 陌生人被擋下 -->
  <line x1="290" y1="418" x2="352" y2="418" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <circle cx="372" cy="418" r="16" fill="#dc2626"/>
  <path d="M365,411 L379,425 M379,411 L365,425" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <text x="398" y="415" font-size="15" font-weight="700" fill="#b91c1c">401 未授權</text>
  <text x="398" y="436" font-size="13" fill="#64748b">在門口就被擋下</text>

  <!-- MCP Server -->
  <rect x="390" y="90" width="280" height="290" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="530" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">MCP Server</text>

  <rect x="410" y="138" width="240" height="66" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="426" y="165" font-size="16" font-weight="700" fill="#92400e">① 檢查 token</text>
  <text x="426" y="189" font-size="13" fill="#475569">像門禁卡，確認你是誰</text>

  <rect x="410" y="214" width="240" height="66" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="426" y="241" font-size="16" font-weight="700" fill="#1e40af">② 執行設計好的工具</text>
  <text x="426" y="265" font-size="13" fill="#475569">AI 不能隨便執行 SQL</text>

  <rect x="410" y="290" width="240" height="66" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="426" y="317" font-size="16" font-weight="700" fill="#166534">③ 記錄稽核紀錄</text>
  <text x="426" y="341" font-size="13" fill="#475569">誰、何時、查了什麼</text>

  <!-- 伺服器 ↔ 資料庫 -->
  <line x1="672" y1="225" x2="762" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="762" y1="255" x2="672" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="717" y="215" text-anchor="middle" font-size="13" fill="#475569">SQL（唯讀）</text>
  <text x="717" y="275" text-anchor="middle" font-size="13" fill="#475569">查詢結果</text>

  <!-- 資料庫 -->
  <path d="M765,180 L765,300 A65,16 0 0 0 895,300 L895,180" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <ellipse cx="830" cy="180" rx="65" ry="16" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="830" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">PostgreSQL</text>
  <text x="830" y="264" text-anchor="middle" font-size="14" fill="#334155">公司資料</text>

  <text x="480" y="482" text-anchor="middle" font-size="14" fill="#475569">一個 MCP Server，所有支援 MCP 的 AI 工具都能連線；沒有 token 的連線在門口就被擋下。</text>
</svg>
