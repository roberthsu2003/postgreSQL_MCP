<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="398" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">從「自己用」到「全公司用」</text>

  <!-- 左:本機 -->
  <rect x="30" y="60" width="430" height="320" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="50" y="92" font-size="18" font-weight="700" fill="#334155">本機 stdio</text>
  <text x="440" y="92" text-anchor="end" font-size="14" fill="#64748b">第 3 章、單元 1</text>

  <rect x="50" y="108" width="250" height="180" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="62" y="128" font-size="13" fill="#64748b">你的電腦</text>
  <rect x="70" y="138" width="210" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="175" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">Claude Desktop</text>
  <line x1="175" y1="184" x2="175" y2="212" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="185" y="203" font-size="12" fill="#64748b">啟動</text>
  <rect x="70" y="216" width="210" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="175" y="240" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">MCP Server</text>
  <text x="175" y="259" text-anchor="middle" font-size="12" fill="#475569">server.py + 資料庫密碼</text>

  <line x1="280" y1="242" x2="340" y2="242" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M345,205 L345,265 A40,11 0 0 0 425,265 L425,205" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <ellipse cx="385" cy="205" rx="40" ry="11" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="385" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">PostgreSQL</text>

  <g font-size="14" fill="#334155">
    <text x="50" y="320">• 只有自己能用</text>
    <text x="50" y="345">• 資料庫密碼在每個人的電腦上</text>
    <text x="50" y="370">• 程式更新時，每個人都要更新</text>
  </g>

  <!-- 右:遠端 -->
  <rect x="490" y="60" width="440" height="320" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="510" y="92" font-size="18" font-weight="700" fill="#1e3a8a">遠端 Streamable HTTP</text>
  <text x="910" y="92" text-anchor="end" font-size="14" fill="#64748b">單元 2</text>

  <g>
    <rect x="510" y="110" width="140" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="580" y="137" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">員工 A</text>
    <rect x="510" y="170" width="140" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="580" y="197" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">員工 B</text>
    <rect x="510" y="230" width="140" height="44" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="580" y="257" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412">員工 C</text>
  </g>
  <g stroke="#475569" stroke-width="2">
    <line x1="650" y1="132" x2="688" y2="160" marker-end="url(#a)"/>
    <line x1="650" y1="192" x2="688" y2="192" marker-end="url(#a)"/>
    <line x1="650" y1="252" x2="688" y2="224" marker-end="url(#a)"/>
  </g>
  <rect x="663" y="276" width="56" height="20" rx="10" fill="#fde68a" stroke="#d97706"/>
  <text x="691" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">+ token</text>

  <rect x="692" y="128" width="120" height="128" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="752" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">MCP Server</text>
  <text x="752" y="198" text-anchor="middle" font-size="12" fill="#475569">公司伺服器</text>
  <text x="752" y="218" text-anchor="middle" font-size="12" fill="#475569">一直開著</text>

  <line x1="812" y1="192" x2="838" y2="192" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M842,160 L842,220 A35,10 0 0 0 912,220 L912,160" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <ellipse cx="877" cy="160" rx="35" ry="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="877" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">PostgreSQL</text>

  <g font-size="14" fill="#334155">
    <text x="510" y="320">• 拿到 token 的員工都能用</text>
    <text x="510" y="345">• 資料庫密碼<tspan font-weight="700">只在伺服器</tspan>，員工拿不到</text>
    <text x="510" y="370">• 伺服器更新一次，全公司生效</text>
  </g>
</svg>
