  <!-- 箭頭 3 → 4 -->
  <line x1="708" y1="115" x2="728" y2="115" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 階段四：第 8 章 -->
  <g transform="translate(732, 18)">
    <rect x="0" y="0" width="210" height="194" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
