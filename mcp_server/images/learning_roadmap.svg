    <text x="105" y="58" text-anchor="middle" font-size="14" font-weight="700" fill="#831843">第 8 章（壓軸）</text>
    <line x1="18" y1="68" x2="192" y2="68" stroke="#fbcfe8" stroke-width="1.5"/>
    <text x="18" y="92" font-size="13" fill="#831843" font-weight="600">• 個人篇：本機 FastMCP</text>
