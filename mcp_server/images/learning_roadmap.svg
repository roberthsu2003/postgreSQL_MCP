  <g transform="translate(494, 18)">
    <rect x="0" y="0" width="212" height="194" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="14" y="12" width="184" height="26" rx="6" fill="#16a34a"/>
    <text x="106" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">【階段三】Python 資料庫應用</text>
